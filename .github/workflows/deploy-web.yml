name: Deploy Web

# Publie la cible web sur GitHub Pages → https://ppcrepin.github.io/kartme/
on:
  push:
    branches: [claude/karting-app-requirements-d5xm1t]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Export web (base URL /kartme)
        env:
          EXPO_BASE_URL: /kartme
        run: npx expo export --platform web

      - name: SPA fallback (routes profondes → index)
        run: cp dist/index.html dist/404.html

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
