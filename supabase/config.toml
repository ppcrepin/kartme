# Configuration Supabase locale — KartSquad
# Docs : https://supabase.com/docs/guides/local-development
project_id = "kartsquad"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["kartsquad://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

# Edge Function d'envoi des notifications (lot 2.4). Pas de JWT : elle est
# appelée par les déclencheurs de la base (pg_net) et protégée par un secret
# partagé (en-tête x-hook-secret == PUSH_HOOK_SECRET).
[functions.push]
verify_jwt = false
